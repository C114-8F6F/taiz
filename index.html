<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حظك اليوم - Earn Rewards</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 480px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
        h2, h3 { color: #38bdf8; margin-top: 0; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; }
        .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #4ade80; }
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; margin-top: 12px; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .btn-withdraw { background: #16a34a; }
        .hidden { display: none; }
        .timer { color: #f43f5e; font-weight: bold; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- شاشة التسجيل -->
    <div id="authSection" class="card">
        <h2>تسجيل الدخول / حساب جديد</h2>
        <input type="text" id="regName" placeholder="الاسم الكامل">
        <input type="tel" id="regPhone" placeholder="رقم الهاتف (مثال: 770000000)">
        <button onclick="registerUser()">دخول / تسجيل</button>
    </div>

    <!-- الشاشة الرئيسية -->
    <div id="mainSection" class="card hidden">
        <h3 id="welcomeMsg">أهلاً بك</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div>الرصيد الحالي</div>
                <div id="userBalance" class="stat-value">0 YER</div>
            </div>
            <div class="stat-box">
                <div>النقاط</div>
                <div id="userPoints" class="stat-value">0</div>
            </div>
        </div>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- مشاهدة الإعلانات -->
        <h3>مشاهدة إعلان وتجميع نقاط</h3>
        <button id="adBtn" onclick="watchAd()">مشاهدة الإعلان (+10 نقاط)</button>
        <div id="cooldownMsg" class="timer hidden"></div>

        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- طلب السحب -->
        <h3>طلب سحب الأرباح</h3>
        <select id="payoutMethod">
            <option value="kuraimi">بنك الكريمي</option>
            <option value="qutaibi">بنك القطيبي (شلن)</option>
            <option value="usdt">USDT (TRC20)</option>
        </select>
        <input type="number" id="withdrawAmount" placeholder="المبلغ المطلوب بالريال">
        <input type="text" id="accountDetails" placeholder="رقم الحساب / عنوان المحفظة">
        <button class="btn-withdraw" onclick="requestWithdraw()">تقديم طلب السحب</button>
    </div>

</div>

<script>
    const API_BASE = 'https://taiz-sw3n.onrender.com/api';
    let currentUser = null;

    async function registerUser() {
        const full_name = document.getElementById('regName').value;
        const phone_number = document.getElementById('regPhone').value;

        if (!full_name || !phone_number) {
            alert('يرجى ملء كافة البيانات');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/users/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ full_name, phone_number, device_id: 'WEB-APP' })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                setupUI();
            } else {
                alert('خطأ: ' + data.error);
            }
        } catch (err) {
            alert('فشل الاتصال بالسيرفر: ' + err.message);
        }
    }

    function setupUI() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('welcomeMsg').innerText = `مرحباً، ${currentUser.full_name}`;
        document.getElementById('userBalance').innerText = `${currentUser.balance_rial} YER`;
        document.getElementById('userPoints').innerText = currentUser.points;
    }

    async function watchAd() {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API_BASE}/ads/watch`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUser.id })
            });
            const data = await res.json();

            if (data.success) {
                alert(data.message);
                currentUser.points += 10;
                document.getElementById('userPoints').innerText = currentUser.points;
            } else {
                alert(data.message);
            }
        } catch (err) {
            alert('خطأ في الاتصال: ' + err.message);
        }
    }

    async function requestWithdraw() {
        const amount = document.getElementById('withdrawAmount').value;
        const payout_method = document.getElementById('payoutMethod').value;
        const account_details = document.getElementById('accountDetails').value;

        if (!amount || !account_details) {
            alert('يرجى تحديد المبلغ وتفاصيل الحساب البنكي/المحفظة');
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: currentUser.id,
                    amount,
                    payout_method,
                    account_details
                })
            });
            const data = await res.json();
            alert(data.message);
        } catch (err) {
            alert('فشل تقديم الطلب: ' + err.message);
        }
    }
</script>

</body>
</html>
